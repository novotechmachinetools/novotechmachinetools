; HostPapa runs PHP through CloudLinux's PHP Selector, which does not read this file (Nov 14 2026: uploads over 2 MB failed).
; The limits in force are set in cPanel -> Select PHP Version -> Options: upload_max_filesize 16M, post_max_size 32M,
; max_file_uploads 20, memory_limit 512M. Keep them in step with quote.php ($MAX_BYTES) if they ever change.
; PHP limits for the quote form's attachments (up to 10 files, 13 MB in total). HostPapa reads .user.ini in the site root.
upload_max_filesize = 13M
post_max_size = 16M
max_file_uploads = 20
; the notification e-mail with 13 MB attached is built in memory
memory_limit = 256M
